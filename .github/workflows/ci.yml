name: CI + Deploy — Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
          cache-version: v2

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: https://api.simcointel.com

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  lighthouse:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
          cache-version: v2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: https://api.simcointel.com

      - name: Start preview server
        run: npx http-server dist -p 8080 -c-1 &
        shell: bash

      - name: Wait for server
        run: sleep 5

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:8080
            http://localhost:8080/macro
            http://localhost:8080/profit-margins
            http://localhost:8080/corporate-suite
            http://localhost:8080/profit-calculator
            http://localhost:8080/construction-calculator
            http://localhost:8080/retail-calculator
            http://localhost:8080/xp-calculator
            http://localhost:8080/about
            http://localhost:8080/alerts
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          failOnFailure: true

  deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Build and publish preview for PRs
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
          cache-version: v2

      - name: Install dependencies
        run: npm ci

      - name: Build Preview
        run: |
          # Set base path to include PR number for uniqueness if desired,
          # though standard GitHub Pages only has one custom domain/root.
          # Here we use pr-preview-action to handle the complexity of subfolders on gh-pages branch.
          npm run build -- --base=/Web/pr-preview/pr-${{ github.event.number }}/
        env:
          VITE_API_BASE: https://api.simcointel.com

      - name: Deploy Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
